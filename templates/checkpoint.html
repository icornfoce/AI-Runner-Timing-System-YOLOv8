<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkpoint | RunnerTrack AI</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--pri:#1D9E75;--pri-g:rgba(29,158,117,.35);--bg:#0b0f14;--sf:#141a22;--card:rgba(22,30,40,.85);--bdr:rgba(255,255,255,.08);--txt:#f0f2f5;--mut:#7a8594;--red:#e53e3e;--grn:#38c172}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow:hidden}
.bar{background:rgba(11,15,20,.95);backdrop-filter:blur(18px);border-bottom:1px solid var(--bdr);padding:.7rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.bar-l{display:flex;align-items:center;gap:1rem}
.bar h1{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:2px;background:linear-gradient(135deg,var(--pri),#2dd4a8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.cp-sel{display:flex;gap:0;flex-wrap:wrap}
.cp-btn{padding:.4rem .7rem;font-family:'Bebas Neue',sans-serif;font-size:.85rem;letter-spacing:1px;cursor:pointer;border:1px solid var(--bdr);background:rgba(255,255,255,.03);color:var(--mut);transition:all .2s}
.cp-btn:first-child{border-radius:8px 0 0 8px}.cp-btn:last-child{border-radius:0 8px 8px 0}
.cp-btn.on{background:rgba(29,158,117,.2);border-color:var(--pri);color:var(--pri)}
.bar-r{display:flex;align-items:center;gap:1rem}
.status{display:flex;align-items:center;gap:.4rem;font-size:.8rem}
.status.ok{color:#4ade80}.status.err{color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%;animation:pulse 2s infinite}
.dot.ok{background:#22c55e}.dot.err{background:var(--red)}
.fps{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--mut)}
.nav-link{color:var(--mut);text-decoration:none;font-size:.8rem}.nav-link:hover{color:var(--pri)}
/* MAIN */
.main{display:flex;height:calc(100vh - 52px)}
.cam-area{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center}
#video{width:100%;height:100%;object-fit:cover}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%}
/* SIDEBAR */
.sidebar{width:280px;background:var(--sf);border-left:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden}
.sb-h{padding:1rem;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:1px;border-bottom:1px solid var(--bdr);color:var(--pri)}
.sb-list{flex:1;overflow-y:auto;padding:.5rem}
.sb-item{padding:.7rem .8rem;border-radius:10px;margin-bottom:.4rem;background:rgba(255,255,255,.03);border:1px solid var(--bdr);animation:slideIn .3s ease}
.sb-item.violation{border-color:var(--red);background:rgba(229,62,62,.06)}
.sb-name{font-weight:600;font-size:.9rem}
.sb-name.viol{color:var(--red)}
.sb-info{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--mut);margin-top:.2rem}
.sb-status{padding:1rem;border-top:1px solid var(--bdr);font-size:.8rem;color:var(--mut)}
.sb-status strong{color:var(--txt)}
/* INIT SCREEN */
.init-screen{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem}
.init-screen.hidden{display:none}
.spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,.1);border-top-color:var(--pri);border-radius:50%;animation:spin 1s linear infinite}
.init-text{color:var(--mut);font-size:.9rem}
.init-steps{list-style:none;text-align:left;margin-top:.5rem}
.init-steps li{padding:.3rem 0;font-size:.82rem;color:var(--mut)}
.init-steps li.done{color:var(--grn)}
.init-steps li.loading{color:var(--pri)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(.95);opacity:.7}70%{transform:scale(1.1);opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:768px){.sidebar{display:none}.bar{flex-wrap:wrap;gap:.5rem}}
</style>
</head>
<body>
<div class="bar">
 <div class="bar-l">
  <h1>📷 CHECKPOINT</h1>
  <div class="cp-sel">
   <button class="cp-btn on" id="cp-start-btn" onclick="setCP('start')">🟢 START</button>
   <button class="cp-btn" id="cp-1-btn" onclick="setCP(1)">CP1</button>
   <button class="cp-btn" id="cp-2-btn" onclick="setCP(2)">CP2</button>
   <button class="cp-btn" id="cp-3-btn" onclick="setCP(3)">CP3</button>
   <button class="cp-btn" id="cp-4-btn" onclick="setCP(4)">CP4</button>
   <button class="cp-btn" id="cp-finish-btn" onclick="setCP('finish')">🏁 FINISH</button>
  </div>
 </div>
 <div class="bar-r">
  <div class="status" id="conn-status"><div class="dot"></div><span>Initializing</span></div>
  <span class="fps" id="fps-display">FPS: --</span>
  <a href="/" class="nav-link">📺 Dashboard</a>
  <a href="/register" class="nav-link">📋 Register</a>
 </div>
</div>

<div class="main">
 <div class="cam-area">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
 </div>
 <div class="sidebar">
  <div class="sb-h">📋 RECENT RECORDS</div>
  <div class="sb-list" id="sb-list"></div>
  <div class="sb-status">Runners loaded: <strong id="runner-count">0</strong></div>
 </div>
</div>

<!-- INIT SCREEN -->
<div class="init-screen" id="init-screen">
 <div class="spinner"></div>
 <div class="init-text">กำลังเตรียมระบบ...</div>
 <ul class="init-steps" id="init-steps">
  <li id="step-models">⏳ โหลดโมเดล AI...</li>
  <li id="step-runners">⏳ โหลดข้อมูลนักวิ่ง...</li>
  <li id="step-camera">⏳ เปิดกล้อง...</li>
 </ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const API="https://script.google.com/macros/s/AKfycbyI4vNBRqjO5f00DN7VDCTaMKUoDqN2L10JHtQtM4tW5A-Uca_btGkOW1ei6OTBcf8g0g/exec";
// Pinned to a release tag — `@master` would silently change at any time.
const MODEL_URL="https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights/";

// ── DEBUG MODE ─────────────────────────────────────────────────
// Append `?debug=1` to the URL to enable verbose OCR/vote console
// logs and an overlay HUD showing tracked-runner / vote / cooldown /
// ocrBusy state. Side-effect-free: production paths are unchanged.
const DEBUG = new URLSearchParams(location.search).get("debug") === "1";

// ── VIDEO ──────────────────────────────────────────────────────
// 720p protects FPS while giving the operator a usable preview.
// TinyFaceDetector internally downsizes to FACE_DETECTOR_INPUT_SIZE
// before inference, so this only affects what the operator sees and
// what we crop for OCR. Going higher (1080p+) bottlenecks face-api.
const VIDEO_WIDTH = 1280;
const VIDEO_HEIGHT = 720;

// ── FACE DETECTION ─────────────────────────────────────────────
// TinyFaceDetector chosen over SSD MobileNet for ~5× higher FPS.
// At checkpoint distance the accuracy delta is negligible. To revert
// to SSD: load `ssdMobilenetv1` instead and pass NO detector options
// to detectAllFaces().
const FACE_DETECTOR_INPUT_SIZE = 320;       // 128/160/224/320/416/512/608
const FACE_DETECTOR_SCORE_THRESHOLD = 0.5;
// Tighter than the v5 default (0.5). Trades more "Unknown" labels for
// fewer false matches — appropriate at a checkpoint where misidentifying
// a runner is more costly than missing them on one frame.
const FACE_MATCH_DISTANCE = 0.45;

// ── BBOX SMOOTHING (EMA) ───────────────────────────────────────
// Per-runner exponential moving average. α=0.35 → ~3-frame half-life.
// Lower α = smoother but laggier. The smoothed box drives BOTH the
// overlay rectangle AND the OCR chest crop — without this, every
// detection-frame jitter shakes the crop and Tesseract reads garbage.
const BBOX_EMA_ALPHA = 0.35;
const BBOX_EMA_RESET_FRAMES = 10;           // drop EMA after N missing frames

// ── RECORDING / COOLDOWNS ──────────────────────────────────────
const RECORD_AFTER_FRAMES = 5;              // consecutive recognitions before logging
const COOLDOWN_SEC = 30;                    // per-CP per-runner record cooldown
const VIOLATION_COOLDOWN_SEC = 60;          // per-CP per-runner violation cooldown

// ── OCR PIPELINE ───────────────────────────────────────────────
const OCR_AFTER_FRAMES = 10;                // consecutive recognitions before triggering OCR
const OCR_CACHE_TTL_MS = 15000;             // stale read purge AND vote-buffer expiry

// Adaptive threshold: each pixel compared to the mean of an
// (ADAPTIVE_THRESHOLD_BLOCK²)-pixel local window minus C. Computed via
// integral image so cost is O(1) per pixel regardless of block size.
const ADAPTIVE_THRESHOLD_BLOCK = 15;        // odd; 11–19 typical
const ADAPTIVE_THRESHOLD_C = 10;
const OCR_UPSCALE = 2;                      // nearest-neighbor; preserves binary edges

// FIELD-TEST: relaxed for indoor lighting + short BIBs.
// Revert to 70 / 2 / 5 once real-world setups are validated. The
// majority-vote gate (OCR_VOTE_MIN_CONSENSUS=3) still requires three
// agreeing reads, so loosening these doesn't lower the violation bar.
const OCR_MIN_CONFIDENCE = 60;
const BIB_MIN_LEN = 1;
const BIB_MAX_LEN = 6;

// Multi-frame majority vote — protects against single-frame OCR misreads.
// Buffer caps at OCR_VOTE_BUFFER_SIZE; consensus declared when
// ≥OCR_VOTE_MIN_CONSENSUS entries agree. Stale entries (>OCR_CACHE_TTL_MS)
// auto-evict, so a drifting OCR self-corrects.
const OCR_VOTE_BUFFER_SIZE = 5;
const OCR_VOTE_MIN_CONSENSUS = 3;

// ── ADVANCED VIOLATION TRIGGERS ────────────────────────────────
// Ghost BIB: consecutive failed OCR attempts on a known runner before
// flagging. Empty result → NO_BIB; failed validation gate (length/conf)
// → OBSCURED_BIB.
const NO_BIB_AFTER_FAILURES = 5;

// Intruder: consecutive frames an unrecognized face must stay visible
// before firing UNREGISTERED. Higher than RECORD_AFTER_FRAMES (5) so it
// requires deliberate presence, not a passerby behind a recognized runner.
const UNREGISTERED_AFTER_FRAMES = 15;

// Multiple BIBs: minimum digits per block, minimum block count.
// 2 digits per block filters Tesseract single-digit fragments;
// 2 blocks is the trigger.
const MULTIPLE_BIBS_MIN_BLOCK_LEN = 2;
const MULTIPLE_BIBS_MIN_BLOCKS = 2;

// ── STATE ──────────────────────────────────────────────────────
let checkpointId = 'start';
let faceMatcher = null;
let runnerRegistry = {};                    // name → bib
let cooldowns = {};                         // "name:cpId" → sec (per-CP record cooldown)
let violationCooldowns = {};                // "name:cpId" → sec (per-CP violation cooldown)
let consecutiveFrames = {};                 // name → count
let bboxEMA = {};                           // name → { x, y, width, height, missingFrames }
let ocrVotes = {};                          // name → [{ bib, ts, conf }, ...]
let ocrConsensus = {};                      // name → { bib, ts }
let ocrFailureCount = {};                   // name → consecutive validation failures (Ghost BIB)
let ocrLastFailureKind = {};                // name → "empty" | "low_quality" — drives NO_BIB vs OBSCURED_BIB
let fpsCounter = 0, lastFpsTime = performance.now();
let ocrBusy = false;
let tesseractWorker = null;
let ocrReady = false;
let videoStream = null;
let loopRunning = false;
let rafId = null;
const CP_BUTTONS = ['start', 1, 2, 3, 4, 'finish'];

// ── CP SELECTOR ──
function setCP(id){
 checkpointId=id;
 CP_BUTTONS.forEach(b=>{
  const el=document.getElementById('cp-'+b+'-btn');
  if(el)el.classList.toggle('on',b===id);
 });
}

// ── INIT ──
async function init(){
 try{
  // 1) Load models — TinyFaceDetector + landmarks + recognition.
  // SSD MobileNet was the v5 default; TinyFaceDetector is ~5× faster
  // and accurate enough at checkpoint distance.
  markStep("step-models","loading");
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
  markStep("step-models","done");

  // 2) Load runners
  markStep("step-runners","loading");
  const res=await fetch(API+"?action=getRunners");
  const d=await res.json();
  const runners=d.data||[];
  document.getElementById("runner-count").textContent=runners.length;

  const labeled=[];
  for(const r of runners){
   if(!r.Embeddings)continue;
   try{
    let emb=JSON.parse(r.Embeddings);
    // Handle nested array [[...]] from multi-angle
    if(Array.isArray(emb) && emb.length>0 && Array.isArray(emb[0])){
     emb=emb[0];
    }
    if(!Array.isArray(emb)||emb.length!==128){console.warn('Bad embedding size for',r.Name,emb.length);continue}
    const desc=new Float32Array(emb);
    labeled.push(new faceapi.LabeledFaceDescriptors(r.Name,[desc]));
    runnerRegistry[r.Name]=String(r.BibNumber||"");
   }catch(e){console.warn("Bad embedding for",r.Name,e)}
  }
  if(labeled.length>0)faceMatcher=new faceapi.FaceMatcher(labeled, FACE_MATCH_DISTANCE);
  markStep("step-runners","done");

  // 3) Camera — surface NotAllowedError specifically so the operator
  // gets actionable feedback instead of a generic stack trace.
  markStep("step-camera","loading");
  try{
   videoStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:VIDEO_WIDTH},height:{ideal:VIDEO_HEIGHT}}});
  }catch(camErr){
   const friendly=(camErr&&(camErr.name==="NotAllowedError"||camErr.name==="PermissionDeniedError"))
    ?"ไม่ได้รับสิทธิ์เข้าถึงกล้อง — โปรดอนุญาตในเบราว์เซอร์"
    :"เปิดกล้องไม่สำเร็จ: "+(camErr&&camErr.message||camErr);
   setStatus("err","❌ "+friendly);
   return;
  }
  const video=document.getElementById("video");
  video.srcObject=videoStream;
  await new Promise(r=>video.addEventListener("loadedmetadata",r,{once:true}));
  // Ensure the video has actually started producing frames
  if(video.readyState<2){await new Promise(r=>video.addEventListener("loadeddata",r,{once:true}));}
  const overlay=document.getElementById("overlay");
  overlay.width=video.videoWidth;
  overlay.height=video.videoHeight;
  // Stop the camera when the page is hidden/unloaded so the indicator
  // light goes off and the OS releases the device.
  window.addEventListener("pagehide",stopCamera);
  markStep("step-camera","done");

  // 4) Init Tesseract — Tesseract.js v5 runs the engine in its own
  // Web Worker so recognize() is non-blocking from the main thread.
  // Whitelist + PSM 7 (single text line) optimize for short numeric
  // BIB strings.
  try{
   tesseractWorker=await Tesseract.createWorker("eng");
   await tesseractWorker.setParameters({
    tessedit_char_whitelist:'0123456789',
    tessedit_pageseg_mode:'7'
   });
   ocrReady=true;
  }catch(e){console.warn("Tesseract init failed, OCR disabled:",e);ocrReady=false;}

  setStatus("ok","🟢 Connected");
  document.getElementById("init-screen").classList.add("hidden");

  // Start loop
  processLoop();
 }catch(e){
  setStatus("err","❌ "+(e&&e.message||e));
 }
}

function stopCamera(){
 if(videoStream){
  videoStream.getTracks().forEach(t=>t.stop());
  videoStream=null;
 }
 loopRunning=false;
 if(rafId!==null){cancelAnimationFrame(rafId);rafId=null;}
}

function markStep(id,state){
 const el=document.getElementById(id);
 el.className=state;
 if(state==="done")el.textContent="✅ "+el.textContent.slice(2);
 else if(state==="loading")el.textContent="🔄 "+el.textContent.slice(2);
}
function setStatus(type,text){
 const el=document.getElementById("conn-status");
 el.className="status "+type;
 el.innerHTML=`<div class="dot ${esc(type)}"></div><span>${esc(text)}</span>`;
}

// ── BBOX EMA SMOOTHING ──────────────────────────────────────
// Per-runner exponential moving average on the detection box. Returns
// the same persistent object so callers can read the latest smoothed
// values without re-allocating. Without smoothing, every detection-
// frame jitter shakes the chest crop and Tesseract confidence collapses.
function smoothBox(name, raw){
 const a=BBOX_EMA_ALPHA;
 const prev=bboxEMA[name];
 if(!prev){
  bboxEMA[name]={x:raw.x,y:raw.y,width:raw.width,height:raw.height,missingFrames:0};
  return bboxEMA[name];
 }
 prev.x = a*raw.x + (1-a)*prev.x;
 prev.y = a*raw.y + (1-a)*prev.y;
 prev.width = a*raw.width + (1-a)*prev.width;
 prev.height = a*raw.height + (1-a)*prev.height;
 prev.missingFrames = 0;
 return prev;
}

// ── OCR PREPROCESSING ───────────────────────────────────────
// Pipeline: grayscale (BT.601 luma) → integral-image-based adaptive
// threshold (mean − C) → nearest-neighbor 2× upscale.
//
// Runs on the main thread because the crop is small (~200×150 px) and
// the integral-image formulation is <1 ms total. A Web Worker would add
// postMessage / structured-clone overhead larger than the work itself.
//
// Nearest-neighbor (not bilinear) is intentional: the threshold output
// is binary, and bilinear would introduce gray pixels that Tesseract
// occasionally mistreats as noise.
function preprocessForOCR(srcCanvas){
 const w=srcCanvas.width, h=srcCanvas.height;
 const ctx=srcCanvas.getContext("2d");
 const imgData=ctx.getImageData(0,0,w,h);
 const src=imgData.data;

 // Grayscale
 const gray=new Uint8ClampedArray(w*h);
 for(let i=0,j=0;i<src.length;i+=4,j++){
  gray[j]=(src[i]*0.299 + src[i+1]*0.587 + src[i+2]*0.114)|0;
 }

 // Integral image — Uint32Array; padded by one row/col so the local-
 // window query doesn't need boundary checks.
 const stride=w+1;
 const integral=new Uint32Array(stride*(h+1));
 for(let y=1;y<=h;y++){
  let rowSum=0;
  for(let x=1;x<=w;x++){
   rowSum += gray[(y-1)*w + (x-1)];
   integral[y*stride + x] = integral[(y-1)*stride + x] + rowSum;
  }
 }

 // Adaptive threshold (mean − C) using the integral image. O(1) per pixel.
 const block=ADAPTIVE_THRESHOLD_BLOCK;
 const half=block>>1;
 const C=ADAPTIVE_THRESHOLD_C;
 const out=new Uint8ClampedArray(w*h);
 for(let y=0;y<h;y++){
  const y0=Math.max(0,y-half), y1=Math.min(h,y+half+1);
  for(let x=0;x<w;x++){
   const x0=Math.max(0,x-half), x1=Math.min(w,x+half+1);
   const area=(y1-y0)*(x1-x0);
   const sum = integral[y1*stride+x1]
             - integral[y0*stride+x1]
             - integral[y1*stride+x0]
             + integral[y0*stride+x0];
   out[y*w + x] = (gray[y*w + x] < (sum/area) - C) ? 0 : 255;
  }
 }

 // Nearest-neighbor 2× upscale.
 const s=OCR_UPSCALE;
 const w2=w*s, h2=h*s;
 const dst=document.createElement("canvas");
 dst.width=w2; dst.height=h2;
 const dstCtx=dst.getContext("2d");
 const dstImg=dstCtx.createImageData(w2,h2);
 const dPix=dstImg.data;
 for(let y=0;y<h2;y++){
  const sy=(y/s)|0;
  for(let x=0;x<w2;x++){
   const sx=(x/s)|0;
   const v=out[sy*w + sx];
   const di=(y*w2 + x)*4;
   dPix[di]=v; dPix[di+1]=v; dPix[di+2]=v; dPix[di+3]=255;
  }
 }
 dstCtx.putImageData(dstImg,0,0);
 return dst;
}

// ── OCR MAJORITY VOTE ───────────────────────────────────────
// Per-runner rolling buffer of recent valid OCR reads. Returns the
// majority BIB iff ≥OCR_VOTE_MIN_CONSENSUS entries agree, otherwise
// null. Stale entries (>OCR_CACHE_TTL_MS) are evicted on every call
// so a drifting OCR self-corrects within the TTL window.
function castVote(name, bib, conf){
 const buf = ocrVotes[name] || (ocrVotes[name]=[]);
 buf.push({bib:bib, ts:Date.now(), conf:conf});
 const cutoff = Date.now() - OCR_CACHE_TTL_MS;
 while(buf.length && buf[0].ts < cutoff) buf.shift();
 while(buf.length > OCR_VOTE_BUFFER_SIZE) buf.shift();

 const counts={};
 for(let i=0;i<buf.length;i++){
  const b=buf[i].bib;
  counts[b]=(counts[b]||0)+1;
 }
 let majBib=null, majCount=0;
 for(const b in counts){
  if(counts[b]>majCount){majBib=b; majCount=counts[b];}
 }
 if(majCount >= OCR_VOTE_MIN_CONSENSUS){
  ocrConsensus[name] = {bib:majBib, ts:Date.now()};
  return majBib;
 }
 return null;
}

// Returns the cached consensus BIB iff still fresh; drops it on expiry
// so a returning runner doesn't see a stale read from a previous lap.
function consensusBib(name){
 const c=ocrConsensus[name];
 if(!c) return null;
 if(Date.now()-c.ts > OCR_CACHE_TTL_MS){delete ocrConsensus[name]; return null;}
 return c.bib;
}

// ── OCR CROP GEOMETRY ───────────────────────────────────────
// Single source of truth for the chest-region crop. Used by BOTH
// processLoop (for the dashed red OCR-debug overlay) AND runSmartOCR
// (for the actual Tesseract input). Identical geometry is critical —
// otherwise the operator's visible OCR rectangle would not match where
// Tesseract is actually looking.
//
// Factors are tuned for hand-held BIBs near chin/neck height (field
// observation: BIBs were missed when held above the chest region).
//   bx = box.x − 0.5·faceH         ← wider than the face
//   by = box.y + 0.6·faceH         ← starts in the chin region
//   bw = box.width + 1.0·faceH     ← roughly 2× face width
//   bh = 3.0·faceH                 ← extends well below the chest
function getOCRCropBox(box, video){
 // Factors widened 2026-05-19: was 0.5 / 0.6 / 1.0 / 3.0. Mirrored
 // from `photo_scanner.html`'s getOCRCropBox per Guardrail 27 — the
 // scanner-side tuning (tight-portrait BIBs near the chin, off-
 // center BIBs on race vests) carries over to live mode if the
 // /checkpoint route is ever re-enabled. Both files must move in
 // lockstep.
 const faceH = box.height;
 const bx = Math.max(0, box.x - faceH * 0.7);
 const by = Math.max(0, box.y + faceH * 0.5);
 const bw = Math.min(box.width + faceH * 1.4, video.videoWidth - bx);
 const bh = Math.min(faceH * 3.0, video.videoHeight - by);
 return {bx:bx, by:by, bw:bw, bh:bh};
}

// ── DEBUG HUD ──────────────────────────────────────────────────
// Top-left overlay strip showing pipeline state. No-op when DEBUG is
// false (early return). Drawn on the same overlay canvas as the
// detection rectangles, so it never touches the DOM (no XSS path).
function drawDebugHUD(ctx){
 if(!DEBUG) return;
 const nowSec = Date.now()/1000;
 const activeCooldowns = Object.values(violationCooldowns)
  .filter(t => (nowSec - t) <= VIOLATION_COOLDOWN_SEC).length;
 const totalVotes = Object.values(ocrVotes)
  .reduce((s,a) => s + (a ? a.length : 0), 0);
 const lines = [
  `tracked: ${Object.keys(bboxEMA).length}`,
  `votes: ${totalVotes}`,
  `cooldowns: ${activeCooldowns}`,
  `ocrBusy: ${ocrBusy}`,
 ];
 ctx.save();
 ctx.fillStyle = "rgba(0,0,0,.65)";
 ctx.fillRect(8, 8, 180, 18*lines.length + 8);
 ctx.fillStyle = "#fff";
 ctx.font = "11px 'JetBrains Mono',monospace";
 for(let i=0;i<lines.length;i++) ctx.fillText(lines[i], 14, 24 + i*18);
 ctx.restore();
}

// ── MAIN LOOP ──
async function processLoop(){
 if(loopRunning)return; // guard against double-start
 loopRunning=true;
 const video=document.getElementById("video");
 const overlay=document.getElementById("overlay");
 const ctx=overlay.getContext("2d");
 // Build detector options once — reusing the instance avoids per-frame
 // allocation. inputSize=320 balances accuracy and speed; tighten to 224
 // for more FPS on weak hardware, loosen to 416 if small/distant faces
 // are missed.
 const detectorOptions = new faceapi.TinyFaceDetectorOptions({
  inputSize: FACE_DETECTOR_INPUT_SIZE,
  scoreThreshold: FACE_DETECTOR_SCORE_THRESHOLD,
 });

 async function frame(){
  if(!loopRunning)return;
  // FPS
  fpsCounter++;
  const now=performance.now();
  if(now-lastFpsTime>=1000){
   document.getElementById("fps-display").textContent=`FPS: ${fpsCounter}`;
   fpsCounter=0;lastFpsTime=now;
  }

  ctx.clearRect(0,0,overlay.width,overlay.height);

  if(!faceMatcher){rafId=requestAnimationFrame(frame);return}

  try{
   const detections = await faceapi.detectAllFaces(video, detectorOptions)
    .withFaceLandmarks()
    .withFaceDescriptors();

   const currentNames=new Set();
   // Per-frame holder for the largest unknown face. Largest by area is the
   // closest face — most likely the actual intruder rather than a
   // bystander in the background of a registered runner's frame.
   let largestUnknownBox = null, largestUnknownArea = 0;

   for(const det of detections){
    const match=faceMatcher.findBestMatch(det.descriptor);
    const name=match.label;
    const dist=match.distance;
    const rawBox=det.detection.box;
    const isKnown = name!=="unknown" && dist<=FACE_MATCH_DISTANCE;

    // EMA-smoothed box only for known runners. Unknowns share the same
    // identity bucket, so smoothing across multiple unknowns would smear
    // the EMA — fall back to raw for those (they're not OCR'd anyway).
    const box = isKnown ? smoothBox(name, rawBox) : rawBox;
    currentNames.add(isKnown ? name : "unknown");

    if(isKnown){
     consecutiveFrames[name]=(consecutiveFrames[name]||0)+1;

     // Record once we've seen this person for N consecutive frames —
     // protects against single-frame false positives. Note: this trigger
     // is independent of OCR consensus; the FACE recognition is what
     // identifies the runner. OCR only gates VIOLATION reporting.
     if(consecutiveFrames[name]>=RECORD_AFTER_FRAMES){
      const cdKey=name+":"+checkpointId; // per-CP so each station fires once
      const nowSec=Date.now()/1000;
      if(!cooldowns[cdKey]||(nowSec-cooldowns[cdKey])>COOLDOWN_SEC){
       cooldowns[cdKey]=nowSec;
       recordCP(name);
      }
     }

     if(consecutiveFrames[name]>=OCR_AFTER_FRAMES && !ocrBusy){
      // Pass the SMOOTHED box — the chest crop must not jitter or
      // Tesseract's confidence collapses.
      runSmartOCR(video, box, name);
     }
    } else {
     // Track the largest unknown face for the post-loop UNREGISTERED
     // trigger. We never OCR unknowns (they have no registered BIB
     // anyway), so the only signal is "stayed visible long enough."
     const area = rawBox.width * rawBox.height;
     if (area > largestUnknownArea){
      largestUnknownArea = area;
      largestUnknownBox = rawBox;
     }
    }

    // Display uses the consensus BIB if available, else the registered
    // BIB, else N/A. consensusBib() handles its own staleness.
    const ocrBib = isKnown ? consensusBib(name) : null;
    const expectedBib = isKnown ? runnerRegistry[name] : null;
    const isMismatch = isKnown && ocrBib && expectedBib && ocrBib !== expectedBib;
    const color = isKnown ? "#38c172" : "#e53e3e";
    const drawColor = isMismatch ? "#e53e3e" : color;
    const bib = ocrBib || expectedBib || "N/A";
    const pct = isKnown ? ((1-dist)*100).toFixed(0) : "0";
    const label = isKnown ? `${name} (${pct}%)` : "Unknown";
    const bibLabel = isKnown ? `BIB: ${bib}` : "";

    ctx.strokeStyle=drawColor; ctx.lineWidth=2;
    ctx.strokeRect(box.x, box.y, box.width, box.height);

    ctx.fillStyle=drawColor;
    ctx.fillRect(box.x, box.y-24, box.width, 24);
    ctx.fillStyle="#fff"; ctx.font="bold 13px 'DM Sans',sans-serif";
    ctx.fillText(label, box.x+4, box.y-8);

    if(bibLabel){
     const bibText = isMismatch ? bibLabel+" ⚠️ MISMATCH" : bibLabel;
     ctx.fillStyle = isMismatch ? "rgba(229,62,62,.8)" : "rgba(29,158,117,.7)";
     ctx.fillRect(box.x, box.y+box.height, box.width, 20);
     ctx.fillStyle="#fff"; ctx.font="11px 'JetBrains Mono',monospace";
     ctx.fillText(bibText, box.x+4, box.y+box.height+14);
    }

    // OCR debug overlay — dashed red rect labeled "OCR" showing the
    // exact region runSmartOCR will crop. Lets the field operator see
    // whether the BIB they're holding falls inside the AI's chest
    // region. Drawn for known runners only — we never OCR Unknowns.
    if(isKnown){
     const oc = getOCRCropBox(box, video);
     ctx.save();
     ctx.strokeStyle = "#ff3b30";
     ctx.lineWidth = 2;
     ctx.setLineDash([6, 4]);
     ctx.strokeRect(oc.bx, oc.by, oc.bw, oc.bh);
     ctx.setLineDash([]);
     ctx.fillStyle = "rgba(255,59,48,.85)";
     ctx.fillRect(oc.bx, oc.by, 32, 16);
     ctx.fillStyle = "#fff";
     ctx.font = "bold 11px 'JetBrains Mono',monospace";
     ctx.fillText("OCR", oc.bx + 4, oc.by + 12);
     ctx.restore();
    }
   }

   // ── POST-LOOP: UNREGISTERED (Intruder) trigger ──
   // Increments at most once per frame regardless of how many unknowns
   // are visible. Largest-area pick was decided in the detection loop.
   // The staleness sweep below resets the counter when no unknown is
   // in frame — strict reset matches consecutiveFrames' behavior for
   // known runners (a one-frame miss restarts the warmup).
   if (largestUnknownBox){
    consecutiveFrames["unknown"] = (consecutiveFrames["unknown"]||0) + 1;
    if (consecutiveFrames["unknown"] >= UNREGISTERED_AFTER_FRAMES){
     const cpLabel = checkpointId==='start' ? 'Start'
                   : checkpointId==='finish' ? 'Finish'
                   : 'CP'+checkpointId;
     const fired = tryFireViolation("unknown:"+checkpointId, {
      name: "Unknown",
      bib: "",
      message: `Unregistered runner detected at ${cpLabel}`,
      violationType: "UNREGISTERED",
      image: captureFaceCrop(video, largestUnknownBox),
     });
     if (fired) consecutiveFrames["unknown"] = 0;
    }
   }

   // Reset stale per-name state. consecutiveFrames goes to 0 immediately
   // (a one-frame miss should retrigger the warmup). EMA persists for
   // BBOX_EMA_RESET_FRAMES so a brief detection miss doesn't kill the
   // smoothing — when it finally expires we also drop the vote buffer
   // and the Ghost BIB failure counters so a returning runner starts
   // with a clean slate.
   for(const n of Object.keys(consecutiveFrames)){
    if(!currentNames.has(n)) consecutiveFrames[n]=0;
   }
   for(const n of Object.keys(bboxEMA)){
    if(!currentNames.has(n)){
     bboxEMA[n].missingFrames = (bboxEMA[n].missingFrames||0) + 1;
     if(bboxEMA[n].missingFrames > BBOX_EMA_RESET_FRAMES){
      delete bboxEMA[n];
      delete ocrVotes[n];
      delete ocrConsensus[n];
      delete ocrFailureCount[n];
      delete ocrLastFailureKind[n];
     }
    }
   }

   drawDebugHUD(ctx);
  }catch(e){console.error("Detection error:",e)}

  rafId=requestAnimationFrame(frame);
 }
 rafId=requestAnimationFrame(frame);
}

// ── SMART OCR ──
// Pipeline (all on top of an EMA-stable box):
//   1. Crop chest region below the face
//   2. preprocessForOCR: grayscale → adaptive threshold → 2× upscale
//   3. Tesseract recognize (worker-thread; non-blocking)
//   4. Validate: digits-only ∧ length ∈ [BIB_MIN_LEN, BIB_MAX_LEN]
//      ∧ confidence ≥ OCR_MIN_CONFIDENCE
//   5. castVote — accumulate per-runner votes; consensus only when
//      ≥OCR_VOTE_MIN_CONSENSUS of the last OCR_VOTE_BUFFER_SIZE agree
//   6. On consensus mismatch with the registered BIB AND no recent
//      violation report on this CP, fire reportViolation
//
// ocrBusy is a single global guard: at most one OCR runs at a time so
// Tesseract can't queue up and drift behind real time. The face-api
// detection loop continues unblocked because tesseractWorker.recognize
// is async and runs in its own Web Worker.
async function runSmartOCR(video, box, name){
 if(ocrBusy || !ocrReady || !tesseractWorker) return;
 ocrBusy=true;
 try{
  // Crop geometry shared with the OCR debug overlay in processLoop
  // via getOCRCropBox — must remain identical or the operator's
  // visible rectangle won't match what Tesseract actually sees.
  const {bx, by, bw, bh} = getOCRCropBox(box, video);
  if(bw<=0 || bh<=0) return;

  const cropCanvas=document.createElement("canvas");
  cropCanvas.width=bw; cropCanvas.height=bh;
  cropCanvas.getContext("2d").drawImage(video, bx, by, bw, bh, 0, 0, bw, bh);

  // Adaptive threshold + 2× nearest-neighbor upscale on the crop. <1 ms.
  const processed=preprocessForOCR(cropCanvas);

  const result=await tesseractWorker.recognize(processed);
  const rawText=String(result.data.text||"");
  const conf=Number(result.data.confidence||0);

  if(DEBUG) console.log("[debug] OCR", { name, rawText, conf });

  // ── MULTIPLE BIBS (Cluttered Chest) ──
  // Run on RAW text BEFORE digit-only normalization — once normalized,
  // the whitespace separating distinct BIB blocks is gone (Guardrail 26).
  // Two-or-more digits per block filters Tesseract single-digit
  // artefacts; ≥2 distinct blocks fires the violation.
  const blockRe = new RegExp("\\d{"+MULTIPLE_BIBS_MIN_BLOCK_LEN+",}", "g");
  const blocks = rawText.match(blockRe) || [];
  if (blocks.length >= MULTIPLE_BIBS_MIN_BLOCKS){
   const fired = tryFireViolation(name+":"+checkpointId, {
    name,
    bib: "",                                          // BIB_PATTERN rejects commas; full list lives in message
    message: `Multiple BIBs detected on ${name}: ${blocks.join(", ")}`,
    violationType: "MULTIPLE_BIBS",
    image: captureFullFrame(video),
   });
   if (fired){
    ocrFailureCount[name] = 0;                       // a multi-bib read isn't a "failure"
    return;
   }
   // Cooldown blocked it — fall through to normal validation. Better to
   // try voting one of the bibs than drop the frame entirely.
  }

  const text=rawText.replace(/[^0-9]/g,"").trim();

  // ── VALIDATION GATE → Ghost BIB counter ──
  // Failures used to silently return; now they feed the Ghost BIB counter.
  // Empty text → NO_BIB; length/confidence fail → OBSCURED_BIB.
  let failureKind = null;
  if (!text) failureKind = "empty";
  else if (text.length < BIB_MIN_LEN || text.length > BIB_MAX_LEN || conf < OCR_MIN_CONFIDENCE)
   failureKind = "low_quality";

  if (failureKind){
   ocrFailureCount[name] = (ocrFailureCount[name]||0) + 1;
   ocrLastFailureKind[name] = failureKind;
   if (ocrFailureCount[name] >= NO_BIB_AFTER_FAILURES){
    const expected = runnerRegistry[name] || "";
    const violationType = ocrLastFailureKind[name] === "empty" ? "NO_BIB" : "OBSCURED_BIB";
    const fired = tryFireViolation(name+":"+checkpointId, {
     name, bib: expected,
     message: violationType==="NO_BIB"
      ? `BIB not visible for ${name}`
      : `BIB unreadable for ${name} (low confidence / wrong length)`,
     violationType,
     image: captureFullFrame(video),
    });
    if (fired) ocrFailureCount[name] = 0;            // reset; next 5 failures can re-trigger after the 60 s cooldown
   }
   return;
  }

  // Validation passed — clear failure state before the vote.
  ocrFailureCount[name] = 0;
  ocrLastFailureKind[name] = null;

  // Cast vote. Returns the consensus BIB (or null if not yet reached).
  const consensus=castVote(name, text, conf);
  if(DEBUG) console.log("[debug] vote", { name, text, conf,
   buffer: (ocrVotes[name]||[]).length, consensus });
  if(!consensus) return;

  const expectedBib=runnerRegistry[name];
  if(expectedBib && consensus !== expectedBib){
   // WRONG_PERSON shares the same name+cpId cooldown bucket with NO_BIB,
   // OBSCURED_BIB, MULTIPLE_BIBS — see Guardrail 25.
   tryFireViolation(name+":"+checkpointId, {
    name, bib: consensus,
    message: `Expected BIB ${expectedBib}, Found ${consensus}`,
    violationType: "WRONG_PERSON",
    image: captureFullFrame(video),
   });
  }
 }catch(e){console.warn("OCR error:",e)}
 finally{ocrBusy=false}
}

// ── CHECKPOINT RECORDING ──
async function recordCP(name){
 const ts=new Date();
 const timeStr=ts.toTimeString().split(" ")[0];// HH:MM:SS
 const bib=runnerRegistry[name]||"";

 addSidebarItem(name,`${checkpointId==='start'?'Start':checkpointId==='finish'?'Finish':'CP'+checkpointId} @ ${timeStr}`,false);

 try{
  const resp=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({
   action:"recordCheckpoint",name,checkpoint_id:checkpointId,timestamp:timeStr,bib
  }),redirect:"follow"});
  const result=await resp.json();
  if(!result||result.status!=="success"){
   addSidebarItem(name,`❌ บันทึกไม่สำเร็จ: ${(result&&result.message)||"Unknown"}`,true);
  }
 }catch(e){
  console.warn("Failed to send CP:",e);
  addSidebarItem(name,"❌ บันทึกไม่สำเร็จ: เชื่อมต่อเซิร์ฟเวอร์ไม่ได้",true);
 }
}

// ── VIOLATION REPORTING ──
// Options-style payload. All five trigger sites (WRONG_PERSON, NO_BIB,
// OBSCURED_BIB, UNREGISTERED, MULTIPLE_BIBS) build their own message +
// image and call this with a uniform shape. The cooldown gate lives
// in tryFireViolation so the 60 s budget is enforced before we hit
// the network or sidebar.
async function reportViolation({ name, bib, message, violationType, image }){
 addSidebarItem(name, `⚠️ ${message}`, "violation");
 try{
  await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({
   action:"reportViolation",
   name, bib, message, violationType,
   timestamp:new Date().toISOString(),
   image,
  })});
 }catch(e){
  console.warn("Failed to send violation:",e);
  addSidebarItem(name,"❌ ส่ง violation ไม่ได้",true);
 }
}

// Snapshot helpers — every fire allocates one canvas; bounded to ≤1
// per minute per cooldown bucket by VIOLATION_COOLDOWN_SEC.
function captureFullFrame(video){
 const canvas=document.createElement("canvas");
 canvas.width=video.videoWidth; canvas.height=video.videoHeight;
 canvas.getContext("2d").drawImage(video,0,0);
 return canvas.toDataURL("image/jpeg",0.7);
}

// Pads 50% beyond the face on each side so the operator sees who it is,
// not just a tightly-framed head. Clamped to video bounds.
function captureFaceCrop(video, box){
 const pad = box.height * 0.5;
 const cx = Math.max(0, box.x - pad);
 const cy = Math.max(0, box.y - pad);
 const cw = Math.min(box.width  + pad*2, video.videoWidth  - cx);
 const ch = Math.min(box.height + pad*2, video.videoHeight - cy);
 const canvas=document.createElement("canvas");
 canvas.width=cw; canvas.height=ch;
 canvas.getContext("2d").drawImage(video, cx, cy, cw, ch, 0, 0, cw, ch);
 return canvas.toDataURL("image/jpeg",0.7);
}

// Single cooldown gate for ALL violation types. Returns true if the
// violation fired, false if blocked by cooldown. Sharing the bucket
// across types prevents stacking different violation types on the same
// name+CP from bypassing the 60 s spam-prevention budget (Guardrail 25).
function tryFireViolation(cooldownKey, payload){
 const nowSec = Date.now()/1000;
 if (violationCooldowns[cooldownKey]
     && (nowSec - violationCooldowns[cooldownKey]) <= VIOLATION_COOLDOWN_SEC){
  return false;
 }
 violationCooldowns[cooldownKey] = nowSec;
 reportViolation(payload);
 return true;
}

// ── SIDEBAR ──
// HTML escape — the `info` field can carry OCR-extracted text and
// `name` carries the runner label, both of which must not be inserted
// raw into innerHTML.
function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function addSidebarItem(name,info,isViol){
 const list=document.getElementById("sb-list");
 const item=document.createElement("div");
 item.className="sb-item"+(isViol?" violation":"");
 item.innerHTML=`<div class="sb-name${isViol?" viol":""}">${isViol?"🔴":"✅"} ${esc(name)}</div><div class="sb-info">${esc(info)}</div>`;
 list.prepend(item);
 // Keep max 20
 while(list.children.length>20)list.lastChild.remove();
}

// START
init();
</script>
